<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Background pixel square -->
  <rect width="32" height="32" rx="6" fill="#131313"/>
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#ff9100" stroke-width="1" stroke-opacity="0.4"/>
  
  <!-- Pixel Dragon Head / Silhouette in Orange & Amber -->
  <!-- Horns -->
  <rect x="7" y="6" width="3" height="3" fill="#ffb97c"/>
  <rect x="10" y="8" width="3" height="2" fill="#ff9100"/>
  <rect x="17" y="6" width="3" height="3" fill="#ffb97c"/>
  <rect x="15" y="8" width="3" height="2" fill="#ff9100"/>
  
  <!-- Head Crown & Brow -->
  <rect x="8" y="9" width="12" height="4" fill="#ff9100"/>
  <rect x="9" y="10" width="10" height="2" fill="#ffb97c"/>
  
  <!-- Eye (Glowing Cyan/Teal Pixel) -->
  <rect x="11" y="11" width="2" height="2" fill="#4fc3f7"/>
  
  <!-- Snout & Jaw -->
  <rect x="8" y="13" width="15" height="4" fill="#ff9100"/>
  <rect x="12" y="14" width="11" height="2" fill="#ffb97c"/>
  <rect x="22" y="15" width="2" height="2" fill="#ffffff"/> <!-- Fang -->
  
  <rect x="10" y="17" width="12" height="3" fill="#b3541e"/>
  <rect x="14" y="18" width="8" height="2" fill="#ff9100"/>
  
  <!-- Neck & Scales -->
  <rect x="8" y="20" width="10" height="4" fill="#ff9100"/>
  <rect x="6" y="22" width="2" height="2" fill="#ffb97c"/>
  <rect x="8" y="24" width="8" height="3" fill="#b3541e"/>
  <rect x="10" y="24" width="2" height="2" fill="#ffb97c"/>
</svg>
